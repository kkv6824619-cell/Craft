
name: Build Craft Car Game APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install project dependencies
        run: npm install --legacy-peer-deps

      - name: Install Capacitor
        run: npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 --legacy-peer-deps

      - name: Build game
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Android project
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Craft-Car-Game-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: craft-apk-${{ github.run_number }}
          name: Craft Car Game APK ${{ github.run_number }}
          body: |
            Automated APK build for Craft Car Game.
            This APK is for testing and installation on Android devices.
          files: android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
